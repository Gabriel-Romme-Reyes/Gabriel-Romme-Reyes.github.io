<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Event-Driven Agentic Automation architecture map"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M1 1 L5.5 3 L1 5" fill="none" stroke="#a9442b" stroke-width="1.1"/></marker></defs><rect x="0" y="0" width="1000" height="540" rx="0" fill="#e5e2d8" stroke="none"/><rect x="0" y="0" width="1000" height="5" rx="0" fill="#a9442b" stroke="none"/><text x="36" y="24" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">SYSTEM MAP / CONCEPTUAL</text><text x="36" y="51" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="0">Event-Driven Agentic Automation</text><text x="36" y="70" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="0">Event intake, rules, orchestration, state and delivery</text><text x="36" y="99" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">01  EVENT EVALUATION</text><rect x="36" y="110" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="110" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">DETECT</text><text x="48" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Event intake</text><text x="48" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Observe activity; emit</text><text x="48" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">identified event</text><rect x="272" y="110" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="272" y="110" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="284" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">BUFFER</text><text x="284" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Event stream</text><text x="284" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Decouple detection</text><text x="284" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">from rule workers</text><rect x="508" y="110" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="508" y="110" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="520" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">EVALUATE</text><text x="520" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Trigger engine</text><text x="520" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Match rule; check state</text><text x="520" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">and duplicate key</text><rect x="744" y="110" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="744" y="110" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="756" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">COORDINATE</text><text x="756" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Orchestrator</text><text x="756" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Advance sequence or</text><text x="756" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">hold for human review</text><path d="M259 157.0 L268 157.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M495 157.0 L504 157.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M731 157.0 L740 157.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="36" y="237" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">02  APPROVED ACTION PATH</text><rect x="36" y="248" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="248" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="266" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">HANDOFF</text><text x="48" y="287" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Job stream</text><text x="48" y="305" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Approved action with</text><text x="48" y="318" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">event context</text><rect x="272" y="248" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="272" y="248" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="284" y="266" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">EXECUTE</text><text x="284" y="287" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Action dispatcher</text><text x="284" y="305" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Consume job; render</text><text x="284" y="318" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">selected action</text><rect x="508" y="248" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="508" y="248" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="520" y="266" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">EXTERNAL</text><text x="520" y="287" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Platform API</text><text x="520" y="305" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Send request using</text><text x="520" y="318" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">account context</text><rect x="744" y="248" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="744" y="248" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="756" y="266" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">RECORD</text><text x="756" y="287" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Outcome journal</text><text x="756" y="305" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Persist result, retry</text><text x="756" y="318" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">state and audit</text><path d="M259 295.0 L268 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M495 295.0 L504 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M731 295.0 L740 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="36" y="375" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">03  STATE AND REPLAY CONTROLS</text><rect x="36" y="386" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="386" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="404" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">STATE</text><text x="48" y="425" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">State service</text><text x="48" y="443" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Sequence position and</text><text x="48" y="456" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">prior action history</text><rect x="272" y="386" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="272" y="386" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="284" y="404" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">GUARD</text><text x="284" y="425" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Deduplication</text><text x="284" y="443" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Stable event / job IDs</text><text x="284" y="456" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">across replays</text><rect x="508" y="386" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="508" y="386" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="520" y="404" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">RECOVER</text><text x="520" y="425" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Retry boundary</text><text x="520" y="443" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Failed work remains</text><text x="520" y="456" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">traceable and bounded</text><rect x="744" y="386" width="220" height="94" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="744" y="386" width="3" height="94" rx="1" fill="#a9442b" stroke="none"/><text x="756" y="404" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">SCOPE</text><text x="756" y="425" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Founding architecture</text><text x="756" y="443" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Service boundaries and</text><text x="756" y="456" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">initial orchestration</text><rect x="36" y="498" width="928" height="31" rx="5" fill="#d6d1c4" stroke="none"/><text x="47" y="516" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0">READ THIS MAP</text><text x="47" y="533" fill="#4d554d" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="400" letter-spacing="0">The state and dedupe controls support evaluation and dispatch; later orchestration work extended the founding architecture.</text></svg>