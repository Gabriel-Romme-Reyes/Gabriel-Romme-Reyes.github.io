<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="API Access &amp; Real-Time Data Pipeline architecture map"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M1 1 L5.5 3 L1 5" fill="none" stroke="#a9442b" stroke-width="1.1"/></marker></defs><rect x="0" y="0" width="1000" height="540" rx="0" fill="#e5e2d8" stroke="none"/><rect x="0" y="0" width="1000" height="5" rx="0" fill="#a9442b" stroke="none"/><text x="36" y="24" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">SYSTEM MAP / CONCEPTUAL</text><text x="36" y="51" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="0">API Access &amp; Real-Time Data Pipeline</text><text x="36" y="70" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="0">Browser-automated auth supports API access and socket ingestion</text><text x="36" y="99" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">AUTH IS THE SHARED FOUNDATION</text><rect x="36" y="110" width="210" height="326" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="110" width="3" height="326" rx="1" fill="#a9442b" stroke="none"/><text x="49" y="129" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">CREDENTIAL LIFECYCLE</text><text x="49" y="151" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0">Auth service</text><text x="49" y="172" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">Browser automation obtains</text><text x="49" y="186" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">and refreshes credentials</text><path d="M49 202 L233 202" fill="none" stroke="#aaa99f" stroke-width="1.6"/><text x="49" y="222" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">GATEWAY INPUT</text><text x="49" y="239" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">Auth context for API</text><text x="49" y="253" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">access and requests</text><path d="M49 269 L233 269" fill="none" stroke="#aaa99f" stroke-width="1.6"/><text x="49" y="289" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">SOCKET INPUT</text><text x="49" y="306" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">Fresh credentials for</text><text x="49" y="320" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">the socket session</text><path d="M49 337 L233 337" fill="none" stroke="#aaa99f" stroke-width="1.6"/><text x="49" y="359" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">SUPPORTING ROLE</text><text x="49" y="376" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">One auth lifecycle feeds</text><text x="49" y="390" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.4" font-weight="400" letter-spacing="0">both upstream paths.</text><text x="272" y="99" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">01  AUTHENTICATED API REQUEST / RESPONSE</text><rect x="272" y="110" width="210" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="272" y="110" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="284" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">EDGE</text><text x="284" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">API gateway</text><text x="284" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Uses auth context;</text><text x="284" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">routes API requests</text><rect x="506" y="110" width="210" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="506" y="110" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="518" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">UPSTREAM</text><text x="518" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Platform API</text><text x="518" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Receives authenticated</text><text x="518" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">request; returns data</text><rect x="740" y="110" width="224" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="740" y="110" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="752" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">RETURN</text><text x="752" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">CRM response</text><text x="752" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Gateway returns usable</text><text x="752" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">response to consumer</text><path d="M485 166.0 L502 166.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M719 166.0 L736 166.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M249 166 L267 166" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="272" y="273" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">02  LIVE EVENT AND READ PATH</text><rect x="272" y="284" width="158" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="272" y="284" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="284" y="302" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">CONNECT</text><text x="284" y="323" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Socket intake</text><text x="284" y="341" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Credentialed</text><text x="284" y="354" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">event session</text><rect x="446" y="284" width="158" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="446" y="284" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="458" y="302" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">CONSUME</text><text x="458" y="323" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Subscriber</text><text x="458" y="341" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Normalize and</text><text x="458" y="354" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">dedupe events</text><rect x="620" y="284" width="158" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="620" y="284" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="632" y="302" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">CACHE</text><text x="632" y="323" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Redis read model</text><text x="632" y="341" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Hydrate initial</text><text x="632" y="354" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">conversation state</text><rect x="794" y="284" width="170" height="112" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="794" y="284" width="3" height="112" rx="1" fill="#a9442b" stroke="none"/><text x="806" y="302" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">PUSH</text><text x="806" y="323" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">SSE to CRM</text><text x="806" y="341" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Incremental</text><text x="806" y="354" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">UI updates</text><path d="M433 340.0 L442 340.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M607 340.0 L616 340.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M781 340.0 L790 340.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M249 340 L267 340" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="272" y="417" width="692" height="63" rx="5" fill="#d6d1c4" stroke="none"/><text x="283" y="435" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0">BOUNDARY</text><text x="283" y="452" fill="#4d554d" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="400" letter-spacing="0">Browser-automated auth supplies gateway and socket credentials. Gateway requests use the Platform API.</text><text x="283" y="465" fill="#4d554d" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="400" letter-spacing="0">Socket events feed subscriber, cache and SSE; the CRM consumes these upstream services.</text></svg>