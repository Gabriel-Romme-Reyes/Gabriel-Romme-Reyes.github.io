<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Customer-to-Sales Routing Engine architecture map"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M1 1 L5.5 3 L1 5" fill="none" stroke="#a9442b" stroke-width="1.1"/></marker></defs><rect x="0" y="0" width="1000" height="540" rx="0" fill="#e5e2d8" stroke="none"/><rect x="0" y="0" width="1000" height="5" rx="0" fill="#a9442b" stroke="none"/><text x="36" y="24" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">SYSTEM MAP / CONCEPTUAL</text><text x="36" y="51" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="0">Customer-to-Sales Routing Engine</text><text x="36" y="70" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="0">CQRS write path, tick checkpoints, incremental projections and dashboard</text><text x="36" y="99" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">01  WRITE SIDE  /  FACTS → TICK → ASSIGNMENT</text><rect x="36" y="110" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="110" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">TRUTH</text><text x="48" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Routing facts</text><text x="48" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Fans, ownership,</text><text x="48" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">pod and shift state</text><rect x="224" y="110" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="224" y="110" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="236" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">PERIODIC</text><text x="236" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Tick planner</text><text x="236" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Capture factual</text><text x="236" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">pod input</text><rect x="412" y="110" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="412" y="110" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="424" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">IMMUTABLE</text><text x="424" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Checkpoint</text><text x="424" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Publish plan and</text><text x="424" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">controller state</text><rect x="600" y="110" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="600" y="110" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="612" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">ARRIVAL</text><text x="612" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Routing engine</text><text x="612" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Use checkpoint;</text><text x="612" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">explain decision</text><rect x="788" y="110" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="788" y="110" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="800" y="128" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">COMMIT</text><text x="800" y="149" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Assignment</text><text x="800" y="167" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Revalidate truth;</text><text x="800" y="180" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">write owner + audit</text><path d="M215 158.0 L220 158.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M403 158.0 L408 158.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M591 158.0 L596 158.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M779 158.0 L784 158.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="36" y="236" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">02  CQRS READ SIDE  /  DISPOSABLE PROJECTIONS</text><rect x="36" y="247" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="247" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="265" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">SOURCE</text><text x="48" y="286" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Write changes</text><text x="48" y="304" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Fan, assignment,</text><text x="48" y="317" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">chatter or pod</text><rect x="224" y="247" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="224" y="247" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="236" y="265" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">OUTBOX</text><text x="236" y="286" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Projection jobs</text><text x="236" y="304" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Small durable jobs;</text><text x="236" y="317" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">deduped by scope</text><rect x="412" y="247" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="412" y="247" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="424" y="265" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">WORKER</text><text x="424" y="286" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Projection worker</text><text x="424" y="304" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Re-read truth;</text><text x="424" y="317" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">refresh affected rows</text><rect x="600" y="247" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="600" y="247" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="612" y="265" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">READ MODEL</text><text x="612" y="286" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Candidates + counts</text><text x="612" y="304" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Per-pod ordering,</text><text x="612" y="317" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">totals and freshness</text><rect x="788" y="247" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="788" y="247" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="800" y="265" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">READ-ONLY</text><text x="800" y="286" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Dashboard</text><text x="800" y="304" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Inspect queue,</text><text x="800" y="317" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">health and decisions</text><path d="M215 295.0 L220 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M403 295.0 L408 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M591 295.0 L596 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M779 295.0 L784 295.0" fill="none" stroke="#a9442b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="36" y="373" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">03  SAFETY  /  PROJECTED CANDIDATES ARE NOT TRUTH</text><rect x="36" y="384" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="36" y="384" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="48" y="402" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">GATE</text><text x="48" y="423" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Source recheck</text><text x="48" y="441" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Stale candidate?</text><text x="48" y="454" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">truth wins on write</text><rect x="224" y="384" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="224" y="384" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="236" y="402" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">AUDIT</text><text x="236" y="423" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Decision record</text><text x="236" y="441" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Selected / blocked</text><text x="236" y="454" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">reason and outcome</text><rect x="412" y="384" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="412" y="384" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="424" y="402" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">RECOVER</text><text x="424" y="423" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Durable retry</text><text x="424" y="441" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Interrupted work</text><text x="424" y="454" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">remains resumable</text><rect x="600" y="384" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="600" y="384" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="612" y="402" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">HANDOFF</text><text x="612" y="423" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Worker checkpoint</text><text x="612" y="441" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Prepare, persist,</text><text x="612" y="454" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">then activate</text><rect x="788" y="384" width="176" height="96" rx="5" fill="#f5f3ec" stroke="#a9aca3"/><rect x="788" y="384" width="3" height="96" rx="1" fill="#a9442b" stroke="none"/><text x="800" y="402" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.7">REPLAY</text><text x="800" y="423" fill="#202320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">Idempotent resume</text><text x="800" y="441" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">Admit once from</text><text x="800" y="454" fill="#505950" font-family="Arial, Helvetica, sans-serif" font-size="10.3" font-weight="400" letter-spacing="0">recorded state</text><rect x="36" y="498" width="928" height="31" rx="5" fill="#d6d1c4" stroke="none"/><text x="47" y="516" fill="#a9442b" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0">SEPARATION</text><text x="47" y="533" fill="#4d554d" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="400" letter-spacing="0">Tick/checkpoint and assignment are on the write side; projection jobs build dashboard read models. The dashboard does not route.</text></svg>